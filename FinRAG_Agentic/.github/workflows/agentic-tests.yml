name: Agentic extension tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m compileall -q agentic evaluation tests
      - run: python -m pytest -q tests/test_finance.py tests/test_sql_safety.py
